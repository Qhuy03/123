<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Product Management</h1>

        <!-- Form nhập URL -->
        <div class="row mb-4">
            <div class="col-md-8 mx-auto">
                <form id="fetch-form" class="input-group">
                    <input id="product-url" type="text" class="form-control" placeholder="Enter product URL..." required>
                    <button type="submit" class="btn btn-primary">Fetch Product</button>
                </form>
                <div id="fetch-result-container" class="mt-3">
                    <textarea id="fetch-result" class="form-control" rows="10" placeholder="Fetched product data will appear here..."></textarea>
                    <button id="add-to-database" class="btn btn-success mt-3" disabled>Add to Database</button>
                </div>
            </div>
        </div>

        <!-- Search bar -->
        <div class="row mb-4">
            <div class="col-md-8 mx-auto">
                <input id="search-input" type="text" class="form-control" placeholder="Search product by name...">
            </div>
        </div>

        <!-- Product grid -->
        <div id="product-grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <!-- Products will be dynamically loaded here -->
        </div>
    </div>

    <script>
        async function fetchProducts(searchQuery = "") {
            try {
                const endpoint = searchQuery
                    ? `/search-products?name=${encodeURIComponent(searchQuery)}`
                    : "/products";

                const response = await fetch(endpoint); // Replace with your actual API endpoint
                const data = await response.json();

                const productGrid = document.getElementById("product-grid");
                productGrid.innerHTML = ""; // Clear existing products

                data.spus.forEach((spu) => {
                    const productCard = document.createElement("div");
                    productCard.className = "col";
                    productCard.innerHTML = `
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title">${spu.product_name}</h5>
                                <p class="card-text">${spu.product_description}</p>
                                <p><strong>Price:</strong> ${spu.product_price} VND</p>
                                <p><strong>Quantity:</strong> ${spu.product_quantity}</p>
                                <p><strong>Category:</strong> ${spu.product_category.join(", ")}</p>
                            </div>
                            <div class="card-footer">
                                <h6>SKUs:</h6>
                                <ul class="list-group">
                                    ${spu.sku.map((sku) => `
                                        <li class="list-group-item">
                                            <strong>Price:</strong> ${sku.sku_price} VND |
                                            <strong>Stock:</strong> ${sku.sku_stock}
                                        </li>
                                    `).join("")}
                                </ul>
                            </div>
                        </div>
                    `;
                    productGrid.appendChild(productCard);
                });
            } catch (error) {
                console.error("Error fetching products:", error);
                const productGrid = document.getElementById("product-grid");
                productGrid.innerHTML = `<div class="alert alert-danger" role="alert">Failed to load products.</div>`;
            }
        }
        // Fetch product data by URL
        document.getElementById('fetch-form').addEventListener('submit', async (event) => {
            event.preventDefault(); // Prevent form submission
            const urlInput = document.getElementById('product-url');
            const resultTextarea = document.getElementById('fetch-result');
            const addButton = document.getElementById('add-to-database');

            try {
                const response = await fetch('/fetch-product-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_url: urlInput.value.trim() })
                });

                const data = await response.json();

                if (response.ok) {
                    resultTextarea.value = data.product_data; // Display JSON in textarea
                    addButton.disabled = false; // Enable the Add to Database button
                } else {
                    resultTextarea.value = `Error: ${data.error}`;
                    addButton.disabled = true; // Disable the button if there's an error
                }
            } catch (error) {
                console.error('Error fetching product data:', error);
                resultTextarea.value = 'Error fetching product data. Please try again.';
                addButton.disabled = true;
            }
        });

        // Add product data to the database
        document.getElementById('add-to-database').addEventListener('click', async () => {
            const resultTextarea = document.getElementById('fetch-result');
            const addButton = document.getElementById('add-to-database');

            try {
                console.log(resultTextarea.value);
                const productData = JSON.parse(resultTextarea.value); // Parse the JSON from the textarea
                const response = await fetch('/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productData)
                });

                if (response.ok) {
                    alert('Product added to database successfully!');
                    resultTextarea.value = ''; // Clear the textarea
                    fetchProducts(); // Fetch products again to display the newly added product
                } else {
                    const errorData = await response.json();
                    alert(`Error: ${errorData.error}`);
                }
            } catch (error) {
                console.error('Error adding product to database:', error);
                alert('Error adding product to database. Please check the data format and try again.');
            }
        });

        // Fetch all products on page load
        fetchProducts();

        // Add search functionality
        const searchInput = document.getElementById("search-input");
        searchInput.addEventListener("input", (event) => {
            const searchQuery = event.target.value.trim();
            fetchProducts(searchQuery);
        });


        const getProductTiki = async () => {
            const limit = 40;
            const include = 'advertisement';
            const aggregations = 2;
            const version = 'home-persionalized';
            const trackity_id = 'a76ff1d2-f8db-4626-59a1-d7c776a51dfd';

            const category = 8594;
            const page = 1;
            const urlKey = 'o-to-xe-may-xe-dap';
            const response = await fetch(`https://tiki.vn/api/personalish/v1/blocks/listings?limit=${limit}&include=${include}&aggregations=${aggregations}&version=${version}&trackity_id=${trackity_id}&category=${category}&page=${page}&urlKey=${urlKey}`);
            const data = await response.json();

            const paging = data.paging
            const products = []
            for (let i = 0; i < paging.last_page; i++) {
                const response = await fetch(`https://tiki.vn/api/personalish/v1/blocks/listings?limit=${limit}&include=${include}&aggregations=${aggregations}&version=${version}&trackity_id=${trackity_id}&category=${category}&page=${i + 1}&urlKey=${urlKey}`);
                const data = await response.json();
                const list = data.data.map(product => {
                    return {
                        // https://tiki.vn/api/v2/products/7139355?platform=web&spid=7139357&version=3
                        id: product.id,
                        spid: product.seller_product_id,
                    }
                });
                products.push(...list);
                console.log(products);
            }

            for (const product of products) {
                const response = await fetch('/get', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify( product )
                })
                const data = await response.json()
                console.log(data)
                const res = await fetch('/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                })

                const resData = await res.json()
                console.log(resData)
            }
        }

        getProductTiki()

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
